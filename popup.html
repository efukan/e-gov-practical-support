<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <img src="icons/icon.svg" alt="logo">
        </div>
        <h1>e-Gov実務サポート</h1>
      </div>
    </header>

    <!-- 一括有効化カード -->
    <div class="global-card">
      <div class="global-info">
        <div class="card-icon-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" />
          </svg>
        </div>
        <div class="card-content">
          <span class="label">機能の有効化</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="feature-global" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- レイアウト調整セクション -->
    <section class="section-group">
      <h2 class="section-title">レイアウト調整</h2>
      <div class="settings-list">
        
        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16M4 12h16M4 18h10" />
                <path d="M16 14h2a2 2 0 0 1 2 2v2" />
                <path d="M16 18h4" />
                <path d="M16 14v4" />
              </svg>
            </div>
            <span class="label">横書き表記変換</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-horizontal" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 5a9 9 0 0 0 0 14" stroke-width="2.5" stroke-dasharray="1 1.5" opacity="0.6" />
                <path d="M11 9h3M11 12h4M11 15h3" stroke-width="2" />
                <path d="M16 5a9 9 0 0 1 0 14" stroke-width="2.5" stroke-dasharray="1 1.5" opacity="0.6" />
              </svg>
            </div>
            <span class="label">括弧書き薄字化</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-dim" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h4" stroke-width="3" />
                <path d="M3 6h2M3 18h2" opacity="0.5" />
                <path d="M10 6h11" opacity="0.5" />
                <path d="M10 12h11" stroke-width="2.5" />
                <path d="M10 18h11" opacity="0.5" />
              </svg>
            </div>
            <span class="label">目次連動ハイライト</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-scrollspy" checked>
            <span class="slider"></span>
          </label>
        </div>
        
      </div>
    </section>

    <!-- 実務支援ツールセクション -->
    <section class="section-group">
      <h2 class="section-title">実務支援ツール</h2>
      <div class="settings-list">
        
        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="12" rx="2" />
                <path d="M7 15v4l4-4" />
                <path d="M7 7h10M7 11h6" opacity="0.6" />
              </svg>
            </div>
            <span class="label">参照条文ポップアップ</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-popup" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                <path d="M9 6h6M9 10h5" opacity="0.6" />
              </svg>
            </div>
            <span class="label">定義語ホバー辞書</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-definition" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.3-4.3" />
                <path d="M8 11h6M11 8l3 3-3 3" />
              </svg>
            </div>
            <span class="label">条文ジャンプ検索</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-jump" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
            </div>
            <span class="label">別タブで開く</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-newtab" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            </div>
            <span class="label">高速レンダリング</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-fastrender" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon-container">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                <path d="M12 7v5M12 15h.01" stroke-width="2.5" stroke-linecap="round" />
              </svg>
            </div>
            <span class="label">被引用（引用元）表示</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="feature-citation" checked>
            <span class="slider"></span>
          </label>
        </div>

      </div>
    </section>

    <!-- オプションページへの遷移ボタン -->
    <button id="open-options" class="options-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>詳細設定・機能の説明を開く</span>
    </button>
  </div>
  <script src="js/settings.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
