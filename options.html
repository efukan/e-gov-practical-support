<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>e-Gov法令ひもとき - 詳細設定</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon48.png">
  <link rel="stylesheet" href="css/options.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー（スクロールしても上端に残す） -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <img src="icons/icon.svg" alt="logo">
        </div>
        <h1>e-Gov法令ひもとき</h1>
      </div>
    </header>

    <!-- 一括有効化カード -->
    <div class="global-card">
      <div class="global-info">
        <div class="card-icon-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" />
          </svg>
        </div>
        <div class="card-text">
          <span class="label">すべての機能を有効にする</span>
          <span class="desc">オフにすると、この拡張は e-Gov のページで何もしません。下の設定は残ります。</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="feature-global" checked>
        <span class="slider"></span>
      </label>
    </div>

    <section class="section-group">
      <h2 class="section-title">条文の見た目</h2>
      <div class="settings-list">
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 6h16M4 12h16M4 18h10" /> <path d="M16 14h2a2 2 0 0 1 2 2v2" /> <path d="M16 18h4" /> <path d="M16 14v4" /> </svg></span>
          <label class="row-text" for="feature-horizontal">
            <span class="label">算用数字（横書き表記）</span>
            <span class="desc">「第一条」を「第１条」に、号の「一」を「(1)」にします。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-horizontal" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M8 5a9 9 0 0 0 0 14" stroke-width="2.5" stroke-dasharray="1 1.5" opacity="0.6" /> <path d="M11 9h3M11 12h4M11 15h3" stroke-width="2" /> <path d="M16 5a9 9 0 0 1 0 14" stroke-width="2.5" stroke-dasharray="1 1.5" opacity="0.6" /> </svg></span>
          <label class="row-text" for="feature-dim">
            <span class="label">括弧書きの薄字化</span>
            <span class="desc">長い括弧書きを薄い灰色にして、本文の骨組みを追いやすくします。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-dim" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="18" cy="6" r="3" /> <circle cx="6" cy="12" r="3" /> <circle cx="18" cy="18" r="3" /> <line x1="8.7" y1="10.7" x2="15.3" y2="7.3" /> <line x1="8.7" y1="13.3" x2="15.3" y2="16.7" /> </svg></span>
          <label class="row-text" for="feature-conjunction">
            <span class="label">接続詞の色分け</span>
            <span class="desc">「並びに・及び」「又は・若しくは」を、大小の段階に合わせて色分けします。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-conjunction" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 12h4" stroke-width="3" /> <path d="M3 6h2M3 18h2" opacity="0.5" /> <path d="M10 6h11" opacity="0.5" /> <path d="M10 12h11" stroke-width="2.5" /> <path d="M10 18h11" opacity="0.5" /> </svg></span>
          <label class="row-text" for="feature-scrollspy">
            <span class="label">目次の追従</span>
            <span class="desc">いま読んでいる条文を、左の目次で強調します。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-scrollspy" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /> </svg></span>
          <label class="row-text" for="feature-fastrender">
            <span class="label">高速レンダリング</span>
            <span class="desc">画面の外にある条文の描画を後回しにして、表示を軽くします。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-fastrender" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="section-group">
      <h2 class="section-title">その場で引く</h2>
      <div class="settings-list">
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect x="3" y="3" width="18" height="12" rx="2" /> <path d="M7 15v4l4-4" /> <path d="M7 7h10M7 11h6" opacity="0.6" /> </svg></span>
          <label class="row-text" for="feature-popup">
            <span class="label">参照条文ポップアップ</span>
            <span class="desc">「第〇条」や他の法令へのリンクにマウスを乗せると、参照先の条文を出します。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-popup" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /> <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /> <path d="M9 6h6M9 10h5" opacity="0.6" /> </svg></span>
          <label class="row-text" for="feature-definition">
            <span class="label">定義語ホバー辞書</span>
            <span class="desc">定義語に下線を引き、マウスを乗せると定義している条文を出します。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-definition" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row is-sub is-color" data-depends-on="definition">
          <span class="label">着色カラー</span>
          <div class="color-swatches-group">
            <button type="button" class="def-color-swatch active" data-color="#00695c" title="緑 / ティール深緑（標準）" style="background-color: #00695c;"></button>
            <button type="button" class="def-color-swatch" data-color="#6a1b9a" title="紫 / パープル（法令ひもとき風）" style="background-color: #6a1b9a;"></button>
            <button type="button" class="def-color-swatch" data-color="#1a5fb4" title="藍 / ブルー" style="background-color: #1a5fb4;"></button>
            <button type="button" class="def-color-swatch" data-color="#c05621" title="琥珀 / アンバー" style="background-color: #c05621;"></button>
            <button type="button" class="def-color-swatch" data-color="#b83280" title="ローズ / ピンク" style="background-color: #b83280;"></button>
            <label class="custom-color-label" title="カスタムカラー選択">
              <input type="color" id="def-color-picker" value="#00695c" class="custom-color-input">
              <span class="custom-color-icon">🎨</span>
            </label>
          </div>
          <div class="color-preview-box">
            見本: この法律において「<span id="def-color-preview-sample" class="def-preview-word">開発行為</span>」とは、建築物の建築をいう。
          </div>
        </div>
        <div class="setting-row is-sub" data-depends-on="definition">
          <label class="row-text" for="feature-definitionMarker">
            <span class="label">定義語の背景色</span>
            <span class="desc">定義語に薄い背景色を付けます。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-definitionMarker">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row is-sub" data-depends-on="definition">
          <label class="row-text" for="feature-parentDefinition">
            <span class="label">親の法律の定義語</span>
            <span class="desc">施行令・施行規則で、親の法律の定義語にも下線を引きます（e-Gov から取得）。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-parentDefinition" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /> <path d="M12 7v5M12 15h.01" stroke-width="2.5" stroke-linecap="round" /> </svg></span>
          <label class="row-text" for="feature-citation">
            <span class="label">被引用（引用元）</span>
            <span class="desc">条の見出しの横の「引用」から、この条文を引用している他の法令を一覧します。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-citation" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M9 14L4 9l5-5" /> <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /> </svg></span>
          <label class="row-text" for="feature-backref">
            <span class="label">同じ法令の中の参照元</span>
            <span class="desc">番号の横に、同じ法令の中から参照している数（↩3 など）を出します。通信はしません。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-backref" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="section-group">
      <h2 class="section-title">条文ページの操作</h2>
      <div class="settings-list">
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="11" cy="11" r="8" /> <path d="M21 21l-4.3-4.3" /> <path d="M8 11h6M11 8l3 3-3 3" /> </svg></span>
          <label class="row-text" for="feature-jump">
            <span class="label">条文ジャンプ</span>
            <span class="desc">右上の入力欄に条番号（例: 5、12-2）を入れて、その条へ移動します。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-jump" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polygon points="12 2.8 14.9 8.7 21.4 9.6 16.7 14.2 17.8 20.6 12 17.6 6.2 20.6 7.3 14.2 2.6 9.6 9.1 8.7" /> </svg></span>
          <label class="row-text" for="feature-favorite">
            <span class="label">お気に入りボタン</span>
            <span class="desc">右上に「☆ お気に入り追加」を置きます。一覧はアイコンを押して出る画面にあります。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-favorite" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect x="2" y="7" width="20" height="10" rx="5" /> <circle cx="8" cy="12" r="2" fill="currentColor" /> <line x1="13" y1="12" x2="18" y2="12" /> </svg></span>
          <label class="row-text" for="feature-quickToggle">
            <span class="label">切り替えボタン</span>
            <span class="desc">右上に、算用数字・括弧などをその場でオン・オフするボタンを置きます。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-quickToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /> <polyline points="15 3 21 3 21 9" /> <line x1="10" y1="14" x2="21" y2="3" /> </svg></span>
          <label class="row-text" for="feature-newtab">
            <span class="label">他の法令を別タブで開く</span>
            <span class="desc">本文の中の他の法令へのリンクを、新しいタブで開きます。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-newtab" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="section-group" id="annotation-section">
      <h2 class="section-title">マーカー・メモ</h2>
      <div class="settings-list">
        <div class="setting-row">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M15 4l5 5L9 20H4v-5z" /> <path d="M13 6l5 5" /> </svg></span>
          <label class="row-text" for="feature-marker">
            <span class="label">マーカー・メモ</span>
            <span class="desc">語句を選ぶと出る帯から、マーカーを引いたりメモを書いたりできます。オフでも保存は消えません。</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="feature-marker" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="annotation-panel">
          <div class="annotation-mode" role="radiogroup" aria-labelledby="annotation-mode-title">
            <span class="annotation-panel-title" id="annotation-mode-title">保存先</span>
            <label class="annotation-radio">
              <input type="radio" name="annotation-mode" value="local">
              <span><strong>この端末の中だけ</strong>（初期値）<br><span class="annotation-radio-desc">外へは送りません。別の端末へは、書き出し・読み込みで移せます。</span></span>
            </label>
            <label class="annotation-radio">
              <input type="radio" name="annotation-mode" value="sync">
              <span><strong>ブラウザの同期で、他の端末とそろえる</strong><br><span class="annotation-radio-desc">同じ Google アカウントでブラウザにログインし、同期をオンにしている他のパソコンなどにも出ます（Edge は Microsoft アカウント、Firefox は Mozilla アカウント）。約60KB・180件、メモは1件500字まで。メモの中身も、ログインしているアカウント（Google など）に保管されます（作者には届きません）。</span></span>
            </label>
          </div>
          <p class="annotation-usage" id="annotation-usage"></p>
          <div class="annotation-actions">
            <button type="button" class="annotation-btn" id="annotation-open-list">一覧を開く（検索・書き直し）</button>
            <button type="button" class="annotation-btn" id="annotation-export">書き出す（JSON ファイル）</button>
            <label class="annotation-btn" for="annotation-import">読み込む</label>
            <input type="file" id="annotation-import" accept="application/json,.json" hidden>
          </div>
          <p class="annotation-status" id="annotation-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </div>
  <script src="js/settings.js"></script>
  <script src="js/annotation_store.js"></script>
  <script src="js/options.js"></script>
</body>
</html>
