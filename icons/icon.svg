<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="e-Gov法令ひもとき">
  <!--
    e-Gov法令ひもとき アイコン原本（マスターベクターSVG）
    本家「法令ひもとき」（himotoki.efukan.jp）と同じ「-5度傾けた『法』」の印影デザインを継承し、
    背景をe-Govブランドネイビー（#1042a4）、丸枠および文字を白色（#ffffff）に統一。
    
    ブラウザタブ（16x16）やツールバーでの視認性を最大化するため、
    白丸枠および「法」の文字を限界まで拡大（候補2：文字290px、白丸r=226）。
  -->
  <g transform="rotate(-5 256 256)">
    <circle cx="256" cy="256" r="248" fill="#1042a4" />
    <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-width="26" />
    <text
      x="256"
      y="266"
      fill="#ffffff"
      font-family="Hiragino Mincho ProN, Yu Mincho, YuMincho, Shippori Mincho, serif"
      font-weight="700"
      font-size="290"
      text-anchor="middle"
      dominant-baseline="central"
    >法</text>
  </g>
</svg>
